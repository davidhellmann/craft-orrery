# Runs the code checks and both test suites on every push and pull request.

name: CI

on:
  push:
  pull_request:

jobs:
  php:
    name: PHP checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, dom, intl, mbstring, pdo, zip
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer check-cs
      - run: composer phpstan
      - run: composer test

  viewer:
    name: Viewer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
