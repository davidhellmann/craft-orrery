# Runs the code checks, the viewer's type check and both test suites on every push and pull request.

name: CI

on:
  push:
  pull_request:

jobs:
  php:
    name: PHP checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, dom, intl, mbstring, openssl, pdo, pdo_sqlite, sqlite3, zip
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer check-cs
      - run: composer phpstan
      - run: composer test

  viewer:
    name: Viewer checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
