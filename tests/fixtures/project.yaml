# A made-up project config in the shape `ProjectConfig::get()` returns, for a museum with two languages and a shop.
# UIDs are readable stand-ins for the UUIDs Craft generates. Items are deliberately out of order.
dateModified: 1767225600
siteGroups:
  group-shop:
    name: Shop
  group-museum:
    name: Museum
sites:
  site-de:
    baseUrl: 'https://museum.test/de/'
    enabled: true
    handle: de
    hasUrls: true
    language: de-DE
    name: Deutsch
    primary: false
    siteGroup: group-museum
    sortOrder: 2
  site-shop:
    baseUrl: 'https://shop.museum.test/'
    enabled: true
    handle: shop
    hasUrls: true
    language: en-GB
    name: Shop
    primary: false
    siteGroup: group-shop
    sortOrder: 3
  site-en:
    baseUrl: $FIXTURE_PRIMARY_SITE_URL
    enabled: true
    handle: en
    hasUrls: true
    language: en-GB
    name: English
    primary: true
    siteGroup: group-museum
    sortOrder: 1
sections:
  section-products:
    defaultPlacement: end
    enableVersioning: true
    entryTypes:
      - uid: et-product
    handle: products
    maxAuthors: 1
    name: Products
    previewTargets: []
    propagationMethod: all
    siteSettings:
      site-shop:
        enabledByDefault: true
        hasUrls: true
        template: shop/_product
        uriFormat: 'products/{slug}'
    type: channel
  section-news:
    defaultPlacement: end
    enableVersioning: true
    entryTypes:
      - name: 'News article'
        uid: et-article
      - uid: et-link
    handle: news
    maxAuthors: 1
    name: News
    previewTargets:
      - label: 'Primary entry page'
        refresh: true
        urlFormat: '{url}'
    propagationMethod: all
    siteSettings:
      site-en:
        enabledByDefault: true
        hasUrls: true
        template: news/_entry
        uriFormat: 'news/{slug}'
      site-de:
        enabledByDefault: true
        hasUrls: true
        template: news/_entry
        uriFormat: 'aktuelles/{slug}'
    type: channel
  section-home:
    defaultPlacement: end
    enableVersioning: true
    entryTypes:
      - uid: et-home
    handle: home
    maxAuthors: 1
    name: Home
    previewTargets:
      - label: 'Primary entry page'
        refresh: true
        urlFormat: '{url}'
    propagationMethod: all
    siteSettings:
      site-en:
        enabledByDefault: true
        hasUrls: true
        template: index
        uriFormat: __home__
      site-de:
        enabledByDefault: true
        hasUrls: true
        template: index
        uriFormat: __home__
    type: single
  section-exhibitions:
    defaultPlacement: end
    enableVersioning: true
    # Before entry types could be renamed per section, they were listed as plain UIDs.
    entryTypes:
      - et-exhibition
      - et-article
    handle: exhibitions
    maxAuthors: 1
    name: Exhibitions
    previewTargets: []
    propagationMethod: all
    siteSettings:
      site-en:
        enabledByDefault: true
        hasUrls: true
        template: exhibitions/_entry
        uriFormat: 'exhibitions/{slug}'
      site-de:
        enabledByDefault: true
        hasUrls: true
        template: exhibitions/_entry
        uriFormat: 'ausstellungen/{slug}'
    structure:
      maxLevels: 2
      uid: structure-exhibitions
    type: structure
  section-people:
    defaultPlacement: end
    enableVersioning: false
    entryTypes:
      - uid: et-person
    handle: people
    maxAuthors: 1
    name: People
    previewTargets: []
    propagationMethod: all
    siteSettings:
      site-en:
        enabledByDefault: true
        hasUrls: false
        template: null
        uriFormat: null
    type: channel
