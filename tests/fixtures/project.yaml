# A made-up project config in the shape `ProjectConfig::get()` returns, for a museum with two languages and a shop.
# UIDs are readable stand-ins for the UUIDs Craft generates. Items are deliberately out of order. Some site settings
# come from environment variables and the `@web` alias, which the tests set.
dateModified: 1767225600
siteGroups:
  group-shop:
    name: Shop
  group-museum:
    name: $FIXTURE_MUSEUM_NAME
sites:
  site-de:
    baseUrl: 'https://museum.test/de/'
    enabled: true
    handle: de
    hasUrls: true
    language: de-DE
    name: Deutsch
    primary: false
    siteGroup: group-museum
    sortOrder: 2
  site-shop:
    baseUrl: '@web/'
    enabled: true
    handle: shop
    hasUrls: true
    language: $FIXTURE_SHOP_LANGUAGE
    name: $FIXTURE_SHOP_NAME
    primary: false
    siteGroup: group-shop
    sortOrder: 3
  site-en:
    baseUrl: $FIXTURE_PRIMARY_SITE_URL
    enabled: true
    handle: en
    hasUrls: true
    language: en-GB
    name: English
    primary: true
    siteGroup: group-museum
    sortOrder: 1
sections:
  section-products:
    defaultPlacement: end
    enableVersioning: true
    entryTypes:
      - uid: et-product
    handle: products
    maxAuthors: 1
    name: Products
    previewTargets: []
    propagationMethod: all
    siteSettings:
      site-shop:
        enabledByDefault: true
        hasUrls: true
        template: shop/_product
        uriFormat: 'products/{slug}'
    type: channel
  section-news:
